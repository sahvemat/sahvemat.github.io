---
layout: default
---
<!-- ChessPublica's <pgn-study> CSS sets html:has(pgn-study)/body:has(pgn-study)
     to overflow:hidden, assuming the element is the only thing on the page.
     We embed it inline in longer articles, so undo that here (same selector,
     later in the document than the CDN stylesheet — wins the cascade tie)
     to keep the rest of the post reachable by normal scrolling. -->
<style>
html:has(pgn-study), body:has(pgn-study) {
    height: auto;
    overflow: visible;
}
</style>
<article class="post-article">

<header class="post-hero">
  <span class="post-eyebrow">ŞAHvMAT · {{ page.section }} · <span data-date="{{ page.date | date: '%Y-%m-%d' }}"></span></span>
  <h1 class="post-title" data-title="{{ page.title }}"></h1>
  <div class="post-meta">
    <span>Yazar: <strong>{{ page.author }}</strong></span>
    <span class="meta-divider">/</span>
    <span>{{ page.event }}</span>
    <span class="meta-divider">/</span>
    <span data-date="{{ page.date | date: '%Y-%m-%d' }}"></span>
  </div>
</header>

{{ content }}

<section class="post-archive"></section>

</article>
