<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='24'>♔</text></svg>" type="image/svg+xml">
    <title>{{ page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Outfit:wght@600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <!-- Pinned to a commit, not the v0.1.0 tag: that tag predates the [P]
         puzzle-mode/readiness-gate work and jsdelivr caches tags forever.
         Move this to an @vX.Y.Z tag once ChessPublica cuts one. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ChessPublica/ChessPublica.github.io@8d14ea92bc41540f1a61abbb6c6f41637b67b90f/dist/ChessPublica.all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/piece-puzzle.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script>
        (function () {
            var stored = localStorage.getItem('sah-theme');
            var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>

</head>
<body>
    <div class="paper-texture"></div>
    <div class="site-container">
        {% include topbar.html %}
        {% include header.html %}
        <main>
            {{ content }}
        </main>
        {% include footer.html %}
    </div>
    <script src="https://cdn.jsdelivr.net/gh/ChessPublica/ChessPublica.github.io@8d14ea92bc41540f1a61abbb6c6f41637b67b90f/dist/ChessPublica.all.min.js"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/piece-puzzle.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
