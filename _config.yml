title: ŞAHvMAT
description: "Dijital Satranç Dergisi"
baseurl: ""
url: "https://sahvemat.github.io"

markdown: kramdown
permalink: /posts/:title/

# Every collection folder (including _posts — Jekyll treats posts as just
# another collection internally) now lives under collections/ instead of
# directly at the repo root, purely to keep the root tidy. This is an
# all-or-nothing switch: Jekyll's reader skips _posts/_drafts entirely
# for any directory outside collections_dir once it's set (see
# Jekyll::Reader#outside_configured_directory?), so _posts had to move
# alongside the rest rather than staying at the root on its own.
#
# The container directory name deliberately has NO leading underscore.
# Jekyll's general directory walk (which is what notices _posts needs
# reading again inside this new location) skips any entry starting with
# "_" before it ever recurses into it (Jekyll::EntryFilter#special?) —
# an underscore-prefixed collections_dir would never get visited by that
# walk at all, silently dropping every real post from the build even
# though the "posts" collection itself still resolves its directory
# correctly. The collection folders inside it (_posts, _kritik-anlar,
# etc.) keep their underscore as usual.
collections_dir: collections

# Jekyll auto-generates data["excerpt"] for any collection document unless
# excerpt_separator resolves to an empty string (see Jekyll::Document
# #generate_excerpt? / #generate_excerpt) — real posts are unaffected
# either way since they set an explicit `excerpt:` string in front matter,
# which the auto-generator's `||=` never overwrites. Without this, moving
# the chapter series below into collections made every chapter (none of
# which sets `excerpt:`) auto-generate one from its own first line of
# content — which for all of them is the {% include chapter-toc.html %}
# call, so the "lede" that showed up under the title was that rendered
# table of contents' text with the tags stripped.
excerpt_separator: ""

# Multi-page post series (each chapter a separate file with its own
# `permalink:` front matter) used to live as loose top-level directories,
# which Jekyll treated as plain pages but which cluttered the repo root.
# Declaring them as collections moves each series into its own `_`-prefixed
# directory (the same convention as _posts/_includes/_data) without
# changing anything about how they render: every file keeps its existing
# `permalink:` and `layout:` front matter untouched, `output: true` just
# tells Jekyll to still build each one as its own page. Collection items
# are never added to `site.posts` (same as when they were plain pages),
# so none of this affects the homepage/archive listings.
collections:
  devlerden-ogrenmek:
    output: true
  fil-v-at:
    output: true
  gunun-incisi:
    output: true
  karlsruhe-ve-yol-ayrimlari:
    output: true
  kritik-anlar:
    output: true
  ogren:
    output: true
  satranc-motorlarinin-dansi:
    output: true
  taktik:
    output: true
  timman-bati-nin-en-iyisi:
    output: true
  whitsun-acik-horvath-ve-arlesli-kiz:
    output: true
