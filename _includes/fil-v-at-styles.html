<style>
/* This post is long-form prose with full <pgn> games, not the usual
   short-post/game-pair mix — the site's default 2-column magazine flow
   (main.css .post-article) crams both the reading text and the boards
   into narrow half-width columns. Scoped to this page only: keep the
   prose single-column. */
@media (min-width: 768px) {
    .post-article {
        column-count: 1;
        column-gap: 0;
        column-rule: none;
    }
}

/* <pgn> is a custom element that replaces *itself* with a plain
   <div class="pgn-container game-card"> once ChessPublica renders it —
   there is no shadow root involved, so this can all be done in real CSS
   instead of trying to reach into one:
   - .video-title.pgn-title is ChessPublica's own auto-generated
     player/event header (with its little icon) — kept as-is here.
   - The actual move-by-move text lives in .pgn-moves, not
     .pgn-container itself — and ChessPublica's own stylesheet already
     sets `.pgn-moves { column-count: 1 }`, so *that's* the selector
     that needs overriding to get the newspaper-style 2-column text
     this post wants.
   - Every diagram (.cp-board-wrapper) sits inline inside .pgn-moves,
     staying *inside* whichever one of the two columns its move falls
     in (not spanning across both) — same as the surrounding move text.
   - The 2-column override only applies at the same >=768px breakpoint
     the rest of this file already uses — on phones .pgn-moves is left
     at ChessPublica's own column-count: 1, since two columns of move
     text and diagrams squeezed into a phone-width screen is unreadable.
   - --board-size (400px by default, from ChessPublica's own :root rule)
     drives every diagram's width — set it once here so all games'
     diagrams agree on the same number, and it comfortably fits inside
     one ~490px-wide column. Inline "Diagram [#]" diagrams get an extra
     .cp-board-wrapper--small class that shrinks them to 75% of
     --board-size via ChessPublica's own max-width; overriding max-width
     directly to a fixed width (rather than leaving ChessPublica's own
     percentage-based centering math in place) is what makes the small
     and the auto-printed default diagram end up the exact same size. */
.post-article > .pgn-container {
    --board-size: min(400px, calc(100vw - 4rem));
    /* --pgn-title-line-height matches ChessPublica's own
       .video-title-text line-height (1.25) — declared up here (rather
       than on .video-title-text itself) so the sibling .video-title-emoji
       rule below can read the same two variables too; custom properties
       only inherit down the tree, not across siblings. */
    --pgn-title-font-size: 1.25rem;
    --pgn-title-line-height: 1.25;
    font-size: 1.1rem;
    /* Same bordered/offset-shadow card frame the site already uses for
       .post-article > figure/table/pgn-study, so a full annotated game
       reads as the same kind of "framed" unit as an image or a diagram
       instead of floating unbounded in the page. The 2rem padding here
       matches --board-size's own "100vw - 4rem" allowance above, so
       diagrams keep fitting exactly inside the frame at any width. */
    margin: 3rem 0;
    padding: 2rem;
    border: 1px solid var(--line);
    background: var(--surface);
    box-shadow: 8px 8px 0 0 var(--fg);
}

/* On phones, the header (title text + icon, both sized off
   --pgn-title-font-size) and every diagram (sized off --board-size)
   scale back down together — smaller frame padding to match, so
   diagrams still fit exactly inside the card at any phone width.
   768px matches the shared mobile cutoff used for board sizing
   everywhere else on the site (.post-game, the ogren/*.md teaching
   diagrams, etc.) — see main.css's own --board-size rules.

   340px was measured against this card's true available width: the
   article's own 1rem side padding plus this card's own 1.25rem padding
   below, i.e. "100vw - 4.5rem" — calc(100vw - 4.5rem) is what actually
   binds on every common phone (comfortably under 340px), filling the
   card edge-to-edge instead of the old 260px, which left ~65-100px of
   unused margin on a typical 375-430px phone. The 340px cap only matters
   on wider "mobile" viewports near the 767px ceiling. */
@media (max-width: 767px) {
    .post-article > .pgn-container {
        --board-size: min(340px, calc(100vw - 4.5rem));
        --pgn-title-font-size: 1rem;
        padding: 1.25rem;
    }
}

/* ChessPublica's own .video-title-text has a fixed 1rem font-size,
   which reads smaller than the 1.1rem move/comment text next to it
   once that base size is raised above — bump it back up so the
   auto-generated header sits comfortably above the body text instead
   of under it. */
.post-article > .pgn-container .video-title-text {
    font-size: var(--pgn-title-font-size);
}

/* ChessPublica's own .video-title-emoji is a fixed 2rem square icon —
   size it to the two-line title text's own total height (font-size *
   line-height * 2 lines) instead of leaving it looking small next to
   the now-enlarged text. */
.post-article > .pgn-container .video-title-emoji {
    width: calc(var(--pgn-title-font-size) * var(--pgn-title-line-height) * 2);
    height: calc(var(--pgn-title-font-size) * var(--pgn-title-line-height) * 2);
}

@media (min-width: 768px) {
    .post-article > .pgn-container .pgn-moves {
        column-count: 2 !important;
        column-gap: 2.5rem;
        column-rule: 1px solid rgba(0, 0, 0, 0.15);
    }
}

.post-article > .pgn-container .cp-board-wrapper {
    break-inside: avoid;
    width: var(--board-size) !important;
    max-width: none !important;
    margin-left: auto !important;
    margin-right: auto !important;
}

/* Header row (icon + player/event text) gets a third item — the "Oyunu
   İncele" button below — pushed to the far right via margin-left: auto
   on the button itself, so ChessPublica's own icon+text markup doesn't
   need touching. flex-wrap lets the button drop to its own line rather
   than overflow when a header's player names already run long. */
.post-article > .pgn-container .video-title.pgn-title {
    flex-wrap: wrap;
    row-gap: 0.5rem;
}

.pgn-study-btn {
    margin-left: auto;
    flex-shrink: 0;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    padding: 0.4rem 1rem;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.pgn-study-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-1px);
}

.pgn-study-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

@media (max-width: 640px) {
    .pgn-study-btn {
        font-size: 10px;
        padding: 0.35rem 0.75rem;
    }
}

/* The dynamically-created <pgn-study> (see the script below) replaces
   the article view in place, so it gets the same card spacing. */
.post-article > pgn-study {
    margin: 3rem 0;
}

/* Chapter numbers are now typed directly into each part's own <h2>
   text ("11 Uzun Teknik") instead of relying on the site's decorative
   ::before counter — needed because Bölüm 11 carries two <h2>s
   (Uzun Teknik + Kapanış Düşünceleri) on one page, so the normal
   :only-of-type suppression no longer applies and the counter would
   print its own "01"/"02" on top of the typed numbers. */
.post-article > h2::before {
    content: none;
    margin-right: 0;
}

/* Piece icons swapped into the post-hero title in place of the ♗/♘
   glyphs (see the script below) — sized off the title's own font-size
   so they scale together, matching the site's piece-theme artwork
   (assets/img/pieces, as used on /ogren/fil/ and /ogren/at/). */
.post-title-piece {
    height: 0.72em;
    width: auto;
    vertical-align: -0.08em;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
}

/* The ⚔️ glyph otherwise renders at the title's own huge font-size
   (inherited straight from .post-title); shrink it to sit between the
   two piece icons instead of towering over them. */
.post-title-swords {
    font-size: 0.4em;
    vertical-align: 0.08em;
}
</style>

<script>
// ChessPublica renders <pgn> by calling replaceWith() on it with a new
// <div class="pgn-container ...">, discarding the original element (and
// with it, the raw PGN source text) in the process — there is no other
// way to read that source back out once it's rendered. This script tag
// sits earlier in the page than ChessPublica's own <script> (see
// _layouts/default.html), so patching replaceWith() here runs before
// ChessPublica ever calls it: every time *any* <pgn> element is replaced,
// its original textContent is stashed on the replacement node itself
// (a plain JS property, not a DOM attribute, so it survives untouched
// regardless of what the PGN text contains). The "Oyunu İncele" button
// below reads it back from there to build a <pgn-study> on demand.
(function () {
    var nativeReplaceWith = Element.prototype.replaceWith;
    Element.prototype.replaceWith = function (replacement) {
        if (this.tagName === 'PGN' && replacement && replacement.nodeType === 1) {
            replacement.__rawPgn = this.textContent;
        }
        return nativeReplaceWith.apply(this, arguments);
    };
})();

// The post-hero <h1 class="post-title"> is filled in by main.js's
// formatPostTitle() (reading data-title) once the DOM is ready — this
// page's own title starts with the ♗ (bishop) and ♘ (knight) glyphs, so
// swap those two characters for the site's actual piece-theme artwork
// right after that happens, instead of relying on the font's Unicode
// chess-symbol glyphs. The ⚔️ between them is wrapped in a span so it can
// be shrunk down from the title's own font-size (see .post-title-swords).
document.addEventListener('DOMContentLoaded', function () {
    var h1 = document.querySelector('.post-title[data-title]');
    if (!h1) return;
    h1.innerHTML = h1.innerHTML
        .replace(/♗/g, '<img class="post-title-piece" src="{{ "/assets/img/pieces/wB.png" | relative_url }}" alt="Fil">')
        .replace(/♘/g, '<img class="post-title-piece" src="{{ "/assets/img/pieces/wN.png" | relative_url }}" alt="At">')
        .replace(/⚔️/g, '<span class="post-title-swords">⚔️</span>')
        // Chapter pages end their title in a two-digit number ("fil v.
        // at 04") — style it like the section headings' own chapter-num
        // (small, mono, accent-red) instead of the title's own huge
        // italic serif.
        .replace(/(\d{2})(<\/em>)/, '<span class="chapter-num">$1</span>$2');
});

// "Oyunu İncele" button, top-right of each game's header (see
// .pgn-study-btn above) — mirrors the site's existing .post-game-toggle
// interaction (a button that swaps the article view for a richer one),
// but here it swaps the annotated-article <pgn> card for ChessPublica's
// synced board+text <pgn-study> viewer (see the 2026-07-17 "pgn-study
// ile tanışın" post), built lazily from the raw PGN text the replaceWith
// patch above stashed on the card. Collapsing that <pgn-study> (its own
// built-in top-right icon) swaps it back to the plain <pgn> article
// view instead of leaving ChessPublica's own little collapsed ribbon
// behind, via window.ChessPublica.initAll() — the same entry point
// ChessPublica's own DOMContentLoaded listener calls, safe to call
// again since every renderer it runs skips elements already marked
// dataset.cpRendered.
//
// This has to wait for the window 'load' event, not DOMContentLoaded:
// ChessPublica itself only renders <pgn> inside its *own*
// DOMContentLoaded listener, registered when its <script> tag runs —
// which is after this include's script tag (earlier in the page, see
// _layouts/default.html) has already registered this listener. Same
// event, so registration order decides firing order: DOMContentLoaded
// here would run before ChessPublica's own handler ever creates the
// .pgn-container cards this loop looks for. 'load' fires strictly after
// every DOMContentLoaded listener (ChessPublica's included) has already
// run to completion, so the cards are guaranteed to exist by then.
window.addEventListener('load', function () {
    // ChessPublica's <pgn-study> wires its own controls (collapse toggle,
    // ribbon title, settings, download/flip/speed icons, ...) through
    // hardcoded page-wide element ids (pgnStudyCollapseToggle,
    // pgnStudyRibbonTitle, etc.), not scoped to the individual <pgn-study>
    // instance — with two open at once, document.getElementById always
    // resolves to the *first* one's elements, so the second instance's
    // own icons and buttons silently do nothing when clicked. Keeping
    // only one open at a time (closing any previously open one first)
    // sidesteps the duplicate-id collision entirely.
    var openStudy = null; // { study, rawPgn, observer }

    function restoreToArticle(entry) {
        entry.observer.disconnect();
        if (entry.tocObserver) entry.tocObserver.disconnect();
        var pgn = document.createElement('pgn');
        pgn.textContent = entry.rawPgn;
        entry.study.replaceWith(pgn);
        window.ChessPublica.initAll();
        if (openStudy === entry) openStudy = null;
    }

    // ChessPublica's TOC ribbon button is always shown and enabled, even
    // for a game with no recognized named openings/sub-variations to
    // list — most of this series' games are annotated middlegame
    // excerpts (a custom FEN, not the start position), so that lookup
    // never finds anything and the button just pops open a permanently
    // empty accordion. The lookup itself is async (it fetches an ECO
    // opening-name table and only then, if anything matched, appends a
    // heading + list to #pgnStudyTocAccordion — see the pgn-study
    // element's own script), so there is no synchronous way to know in
    // advance whether it'll be empty. Hide the button as soon as the
    // study opens and reveal it again only once that lookup actually
    // adds something to the accordion.
    function hideTocButtonUntilPopulated(entry) {
        var tocBtn = document.querySelector('.pgn-study-ribbon-btn[data-ribbon-action="toc"]');
        var accordion = document.getElementById('pgnStudyTocAccordion');
        if (!tocBtn || !accordion) return;
        tocBtn.style.display = 'none';
        entry.tocObserver = new MutationObserver(function () {
            if (accordion.childElementCount === 0) return;
            tocBtn.style.display = '';
            entry.tocObserver.disconnect();
        });
        entry.tocObserver.observe(accordion, { childList: true });
    }

    function enhanceCard(card) {
        if (card.__enhanced) return;
        card.__enhanced = true;
        var rawPgn = card.__rawPgn;
        var header = card.querySelector('.video-title.pgn-title');
        if (!rawPgn || !header) return;

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pgn-study-btn';
        btn.textContent = 'Oyunu İncele';
        header.appendChild(btn);

        btn.addEventListener('click', function () {
            if (openStudy) restoreToArticle(openStudy);

            var study = document.createElement('pgn-study');
            study.textContent = rawPgn;
            card.replaceWith(study);

            var entry = { study: study, rawPgn: rawPgn, observer: null, tocObserver: null };
            hideTocButtonUntilPopulated(entry);
            entry.observer = new MutationObserver(function () {
                // ChessPublica's own collapse-toggle icon adds this class
                // to the <pgn-study> — react to it the same way a switch
                // to a different game's study does (see restoreToArticle
                // above and window.ChessPublica.initAll()'s doc comment
                // there), instead of leaving its own mini collapsed
                // ribbon behind.
                if (study.classList.contains('pgn-study-collapsed')) restoreToArticle(entry);
            });
            entry.observer.observe(study, { attributes: true, attributeFilter: ['class'] });
            openStudy = entry;
        });
    }

    // Enhance every card already on the page, and — since collapsing a
    // <pgn-study> above rebuilds a brand new .pgn-container rather than
    // reusing the old one — any later one too.
    var postArticle = document.querySelector('.post-article');
    document.querySelectorAll('.post-article > .pgn-container').forEach(enhanceCard);
    new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
            m.addedNodes.forEach(function (node) {
                if (node.nodeType === 1 && node.classList.contains('pgn-container')) enhanceCard(node);
            });
        });
    }).observe(postArticle, { childList: true });
});
</script>
