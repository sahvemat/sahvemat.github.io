<!-- Was an inline <style>+<script> block duplicated in full on every
     fil-v-at chapter page (~17KB x 12 pages, re-downloaded and
     re-parsed on every page load with no caching). Externalized to
     assets/css/fil-v-at.css and assets/js/fil-v-at.js so browsers fetch
     it once and reuse it across chapters. The script must still run
     (and patch Element.prototype.replaceWith) before ChessPublica's own
     DOMContentLoaded handler renders <pgn> elements — `defer` preserves
     that: deferred scripts always finish before DOMContentLoaded fires,
     regardless of order relative to ChessPublica's own non-deferred
     <script> tag in _layouts/default.html. -->
<link rel="stylesheet" href="{{ '/assets/css/fil-v-at.css' | relative_url }}">
<script src="{{ '/assets/js/fil-v-at.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
