<details class="toc-box">
  <summary class="toc-label">İçindekiler</summary>
  <ol class="toc-list">
    {% for item in site.data.fil_v_at_toc %}
    <li{% if item.url == page.url %} class="toc-current"{% endif %}><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
    {% endfor %}
  </ol>
</details>
